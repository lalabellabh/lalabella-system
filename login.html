<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090506"><title>Lalabella — Secure Login</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>:root{--bg:#090506;--panel:#160b10;--line:rgba(230,196,122,.25);--gold:#e6c47a;--cream:#f7eee5;--muted:#b39a98;--rose:#d77b91}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,rgba(169,54,82,.22),transparent 34%),radial-gradient(circle at 85% 80%,rgba(230,196,122,.12),transparent 30%),linear-gradient(145deg,#070405,#160a10 55%,#080405);color:var(--cream);font-family:Inter,Arial,sans-serif}.card{width:min(430px,calc(100% - 30px));padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(22,11,16,.82);backdrop-filter:blur(18px);box-shadow:0 25px 80px #0009}.brand{text-align:center;color:var(--gold);font-size:12px;letter-spacing:.35em;text-transform:uppercase}.rose{text-align:center;font-size:58px;margin:8px 0}.title{text-align:center;font-family:Georgia,serif;font-size:42px;margin:0 0 6px}.sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:25px}label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.16em;margin:14px 0 6px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0c0709;color:var(--cream);outline:none}input:focus{border-color:var(--gold)}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#f1d38c,#c79a4d);color:#24150c;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.remember{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px;margin-top:13px}.remember input{width:auto}.msg{min-height:18px;margin-top:14px;text-align:center;color:var(--rose);font-size:11px}.hint{text-align:center;color:#806b6a;font-size:9px;margin-top:20px}</style></head><body><main class="card"><div class="brand">Lalabella System</div><div class="rose">🌹</div><h1 class="title">Welcome Back</h1><div class="sub">Secure Supabase workspace</div><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><label class="remember"><input id="remember" type="checkbox" checked> Keep me signed in on this device</label><button id="submit" type="submit">Sign In</button><div class="msg" id="msg"></div></form><div class="hint">Authentication is handled by Supabase Auth. No Google Sheets or Apps Script login is used.</div></main><script>(async()=>{const msg=document.getElementById('msg'),form=document.getElementById('form'),btn=document.getElementById('submit');try{const u=await LalabellaAuth.getUser();if(u)location.replace('index.html')}catch(e){}form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='Signing in…';try{const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {data,error}=await LalabellaAuth.signIn(email,password);if(error)throw error;if(!data.user)throw new Error('Login failed.');const profile=await LalabellaAuth.getProfile();if(!profile){await LalabellaAuth.signOut();throw new Error('Your account is not configured in Lalabella profiles.');}location.replace('index.html')}catch(err){msg.textContent=err?.message||'Unable to sign in.';btn.disabled=false;btn.textContent='Sign In'}})})();</script></body></html>
