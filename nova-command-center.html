<!doctype html>
<html lang="en">
<head>
<script src="auth-guard.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOYBOY — Lalabella Intelligence</title>
<style>
:root{--bg:#030711;--panel:#0b1019;--line:#202a38;--text:#edf7ff;--muted:#8190a3;--blue:#1687ff;--cyan:#2ee8ff;--green:#63e6a2;--red:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:240px minmax(0,1fr) 300px;background:radial-gradient(circle at 50% 45%,rgba(22,135,255,.16),transparent 38%),#020711}.side,.right{background:rgba(7,11,17,.9);backdrop-filter:blur(16px);padding:18px;border-color:var(--line)}.side{border-right:1px solid var(--line);display:flex;flex-direction:column}.right{border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}.brand{display:flex;gap:10px;align-items:center;padding:4px 5px 18px;border-bottom:1px solid var(--line)}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8fd8ff,#1687ff);color:#00111f;font-weight:900}.brand b{font-size:13px;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:3px;letter-spacing:.12em}.nav{display:grid;gap:6px;margin-top:18px}.nav button{border:1px solid transparent;background:transparent;color:#aeb9c7;text-align:left;padding:11px;border-radius:10px;cursor:pointer}.nav button:hover{background:#111925;border-color:#243346;color:#fff}.sideFoot{margin-top:auto;color:#687689;font-size:10px;line-height:1.6}.main{min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}.title{font-size:11px;letter-spacing:.2em;color:#b6c1ce}.clock{font-size:11px;color:#728095}.stage{position:relative;flex:1;display:grid;place-items:center;overflow:hidden}.ring{position:absolute;width:min(58vw,620px);height:min(58vw,620px);border:1px solid rgba(46,232,255,.22);border-radius:50%;transform:rotateX(70deg) rotateZ(15deg);animation:spin 16s linear infinite}.ring.two{width:min(42vw,430px);height:min(42vw,430px);animation-duration:11s;animation-direction:reverse;border-color:rgba(22,135,255,.3);transform:rotateX(70deg) rotateZ(-35deg)}@keyframes spin{to{transform:rotateX(70deg) rotateZ(375deg)}}.core{width:min(330px,45vw);height:min(330px,45vw);min-width:230px;min-height:230px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;background:radial-gradient(circle at 50% 40%,#eaffff 0,#43caff 4%,#1687ff 14%,#09224a 34%,#030711 68%);border:1px solid #4dc9ff;box-shadow:0 0 55px rgba(22,135,255,.62),0 0 130px rgba(22,135,255,.28),inset 0 0 70px #000;animation:breathe 3s ease-in-out infinite}.core:before,.core:after{content:"";position:absolute;inset:15px;border:1px solid rgba(46,232,255,.45);border-radius:50%}.core:after{inset:34px;border-style:dashed;animation:spin 8s linear infinite}@keyframes breathe{50%{transform:scale(1.035);box-shadow:0 0 80px rgba(22,135,255,.85),0 0 160px rgba(22,135,255,.38),inset 0 0 80px #000}}.coreText{text-align:center;z-index:5;text-shadow:0 0 18px rgba(46,232,255,.7)}.coreText strong{display:block;font-size:clamp(30px,4vw,44px);letter-spacing:.18em}.coreText span{font-size:9px;letter-spacing:.3em;color:#8fd8ff}.state{position:absolute;top:25px;color:#8a96a7;font-size:10px;letter-spacing:.18em}.state b{color:#eaf6ff}.mic{position:absolute;right:24px;bottom:24px;width:52px;height:52px;border-radius:50%;border:1px solid #31516b;background:#0b121c;color:#9ee8ff;cursor:pointer;box-shadow:0 0 25px rgba(46,232,255,.15);z-index:4}.transcript{position:absolute;left:24px;bottom:24px;max-width:48%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#0b1019;color:#c9d4df;font-size:12px;display:none;z-index:4}.transcript.show{display:block}.card{border:1px solid var(--line);border-radius:13px;background:#0a0f17;padding:14px}.card h3{margin:0 0 10px;font-size:9px;letter-spacing:.18em;color:#7f8c9d}.activity{flex:1;overflow:auto}.event{padding:9px 0;border-bottom:1px solid #17202b;font-size:11px;overflow-wrap:anywhere}.event span{display:block;color:#5f6d7e;font-size:9px;margin-bottom:3px}.quick{display:grid;gap:6px}.quick button{border:1px solid #202c3b;background:#101722;color:#b9c5d2;border-radius:9px;padding:9px;text-align:left;cursor:pointer}.quick button:hover{border-color:#35719b;color:#fff}.ready{color:var(--green)}.error{color:var(--red)}@media(max-width:900px){.app{grid-template-columns:1fr}.side,.right{display:none}.top{height:56px}.transcript{max-width:80%;left:15px;bottom:15px}.mic{right:15px;bottom:15px}.ring{width:70vw;height:70vw}.ring.two{width:48vw;height:48vw}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><div class="logo">J</div><div><b>JOYBOY</b><small>LALABELLA INTELLIGENCE</small></div></div><nav class="nav"><button data-page="index.html">⌂ Command Center</button><button data-page="flower-tools.html">✿ Flower Tools</button><button data-page="flower-dashboard.html">▣ Flower Dashboard</button><button data-page="item-inventory.html">▤ Item Inventory</button><button data-page="chocolate-calc.html">◈ Chocolate</button><button data-page="order-form.html">＋ Order Form</button></nav><div class="sideFoot">SUPABASE SECURE MODE<br>No Google Sheets / Apps Script runtime</div></aside>
<main class="main"><header class="top"><div class="title">LALABELLA / NOVA COMMAND CENTER</div><div class="clock" id="clock">—</div></header><section class="stage" id="stage"><div class="ring"></div><div class="ring two"></div><div class="state" id="state">STATUS: <b>READY</b></div><div class="core" id="core"><div class="coreText"><strong>NOVA</strong><span>INTELLIGENCE CORE</span></div></div><button class="mic" id="mic" title="Voice input">●</button><div class="transcript" id="transcript"></div></section></main>
<aside class="right"><div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>LIVE ACTIVITY</h3><div class="activity" id="activity"></div></div><div class="card"><h3>QUICK COMMANDS</h3><div class="quick"><button data-command="open flower tools">Open Flower Tools</button><button data-command="open flower dashboard">Open Flower Dashboard</button><button data-command="open item inventory">Open Item Inventory</button><button data-command="what time is it">What time is it?</button></div></div></aside>
</div>
<script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), activity=$('activity'), state=$('state'), transcript=$('transcript');
const API=window.LALABELLA_SUPABASE.url+'/functions/v1/nova-api'; let session={}; let recognition=null;
function log(text,who='SYSTEM'){const d=document.createElement('div');d.className='event';d.innerHTML='<span>'+who+' · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</span><b>'+String(text).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</b>';activity.prepend(d);}
function setState(s){state.innerHTML='STATUS: <b>'+s+'</b>';}
function show(t){transcript.textContent=t;transcript.classList.add('show');setTimeout(()=>transcript.classList.remove('show'),6500);}
function navigate(p){if(!p)return;log('Opening '+p,'NOVA');setTimeout(()=>location.href=p,250)}
async function local(message){const t=message.toLowerCase().trim();if(/^(what time is it|time|current time)$/.test(t))return 'It is '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.';const routes=[[/flower tools/,'flower-tools.html'],[/flower dashboard/,'flower-dashboard.html'],[/item inventory/,'item-inventory.html'],[/chocolate/,'chocolate-calc.html'],[/order form/,'order-form.html']];if(/^(open|go to|show|take me to) /.test(t)){for(const [r,p] of routes)if(r.test(t)){navigate(p);return 'Opening it, Boss.'}}if(/^(hi|hello|hey)( nova| joyboy)?$/.test(t))return 'Hello Boss. NOVA is ready.';return null;}
async function ask(message){const localReply=await local(message);if(localReply)return localReply;setState('THINKING');const {data,error}=await window.LalabellaAuth.getSession();if(error||!data.session){location.replace('login.html');throw Error('Session expired. Please log in again.')}const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({message,session,context:{page:'NOVA Command Center',app:'Flower Tools'}})});const payload=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok||!payload.ok)throw Error(payload.error||'NOVA request failed');session=payload.session||session;if(payload.navigateTo)navigate(payload.navigateTo);return payload.text||'I could not produce a response.';}
async function run(message){const text=String(message||'').trim();if(!text)return;log(text,'YOU');show(text);try{const reply=await ask(text);log(reply,'NOVA');show(reply);setState('READY');}catch(e){console.error(e);log(e.message,'ERROR');show(e.message);setState('ERROR');}}
$('mic').onclick=()=>{if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){run('Voice input is not supported in this browser.');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;setState('LISTENING');recognition.onresult=e=>run(e.results[0][0].transcript);recognition.onerror=e=>{log('Voice error: '+e.error,'ERROR');setState('READY')};recognition.onend=()=>setState('READY');recognition.start();};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>run(b.dataset.command));setInterval(()=>$('clock').textContent=new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),1000);log('Secure NOVA interface initialized.','SYSTEM');
</script></body></html>
