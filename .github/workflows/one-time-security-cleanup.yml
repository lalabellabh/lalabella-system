name: One-time security cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'security: enforce Supabase-only session guard and add login') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy runtime bridge and wire NOVA to Supabase Edge Function
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('auth-guard.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"\n\s*// Compatibility bridge for the legacy NOVA UI\..*?\n\s*}\n\s*}\n", "\n", s, flags=re.S)
          s=s.replace("const publicPages=new Set(['login.html','index.html']);", "const publicPages=new Set(['login.html']);")
          p.write_text(s,encoding='utf-8')

          p=Path('nova-command-center.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const NOVA_API_URL = 'https://script\\.google\\.com/macros/s/[^']+/exec';", "const NOVA_API_URL = window.LALABELLA_SUPABASE.url + '/functions/v1/nova-api';", s)
          s=s.replace("    // GET, not POST — Google Apps Script Web Apps deliver every\n    // response via an internal redirect, and browsers convert a POST\n    // to GET when following that kind of redirect. That meant doPost()\n    // was never actually reached; every real chat request was quietly\n    // landing back on the backend's default \"online\" response instead\n    // of the real answer. GET sidesteps this entirely and matches the\n    // pattern every other Lalabella backend already relies on — all\n    // parameters travel as URL query parameters instead of a POST body.\n    const lalabellaToken = window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '';\n    const sessionStr = JSON.stringify(session || {});\n    const contextStr = JSON.stringify({page:'NOVA Command Center',app:'Flower Tools'});\n    const url = NOVA_API_URL\n      + '?action=chat'\n      + '&message=' + encodeURIComponent(message)\n      + '&token=' + encodeURIComponent(lalabellaToken)\n      + '&session=' + encodeURIComponent(sessionStr)\n      + '&context=' + encodeURIComponent(contextStr);\n\n    // URL-length monitoring — GET requests have a practical safe limit\n    // around 2000 characters across browsers/servers. A long-running\n    // conversation (growing `session`) could eventually approach that\n    // and get silently truncated by some intermediary, so this warns\n    // in Live Activity well before that actually happens, rather than\n    // failing mysteriously later. 1500 = getting close; 1900 = right\n    // at the edge, this specific message may already be at risk.\n    if(url.length >= 1900){\n      log('⚠️ Request URL is ' + url.length + ' chars — very close to the safe GET limit (~2000). This message may get cut off. Consider starting a fresh conversation.', 'SYSTEM');\n    } else if(url.length >= 1500){\n      log('Request URL is ' + url.length + ' chars and growing (safe limit ~2000) — conversation is getting long.', 'SYSTEM');\n    }\n\n    const r=await fetch(url, { signal: abortController.signal });", "    const r=await fetch(NOVA_API_URL, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,session,context:{page:'NOVA Command Center',app:'Flower Tools'}}),signal:abortController.signal});")
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/one-time-security-cleanup.yml').unlink()
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "security: remove legacy Apps Script runtime from NOVA"
          git push