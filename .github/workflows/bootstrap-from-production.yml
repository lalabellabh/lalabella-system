name: Bootstrap from Lalabella System Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development repository
        uses: actions/checkout@v4

      - name: Copy previously cloned migration baseline
        run: |
          rm -rf migration-source
          git clone --depth 1 --branch lalabella-system-supabase https://github.com/lalabellabh/lalabella-calculator.git migration-source
          rm -rf migration-source/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name migration-source -exec rm -rf {} +
          cp -a migration-source/. .
          rm -rf migration-source
          rm -f .github/workflows/bootstrap-from-production.yml

      - name: Commit migration baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: bootstrap from verified Supabase migration baseline"
          git push origin HEAD:main
