name: Bootstrap from Lalabella Production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development repository
        uses: actions/checkout@v4

      - name: Copy stable production source
        run: |
          rm -rf production-source
          git clone --depth 1 --branch main https://github.com/lalabellabh/lalabella-calculator.git production-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name production-source -exec rm -rf {} +
          cp -a production-source/. .
          rm -rf production-source
          rm -f .github/workflows/bootstrap-from-production.yml

      - name: Commit stable baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: bootstrap development repo from stable main"
          git push origin HEAD:main
