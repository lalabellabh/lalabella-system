name: Security cleanup v2
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy runtime references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('auth-guard.js')
          s = p.read_text()
          s = re.sub(r"\n        // Compatibility bridge for the legacy NOVA UI\..*?\n        }\n      }", "\n      }", s, flags=re.S)
          s = s.replace("const publicPages=new Set(['login.html','index.html']);", "const publicPages=new Set(['login.html']);")
          p.write_text(s)
          p = Path('nova-command-center.html')
          s = p.read_text()
          s = re.sub(r"const NOVA_API_URL = 'https://script\\.google\\.com/macros/s/[^']+/exec';", "const NOVA_API_URL = window.LALABELLA_SUPABASE.url + '/functions/v1/nova-api';", s)
          old = """    const lalabellaToken = window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '';
    const sessionStr = JSON.stringify(session || {});
    const contextStr = JSON.stringify({page:'NOVA Command Center',app:'Flower Tools'});
    const url = NOVA_API_URL
      + '?action=chat'
      + '&message=' + encodeURIComponent(message)
      + '&token=' + encodeURIComponent(lalabellaToken)
      + '&session=' + encodeURIComponent(sessionStr)
      + '&context=' + encodeURIComponent(contextStr);

    // URL-length monitoring — GET requests have a practical safe limit
    // around 2000 characters across browsers/servers. A long-running
    // conversation (growing `session`) could eventually approach that
    // and get silently truncated by some intermediary, so this warns
    // in Live Activity well before that actually happens, rather than
    // failing mysteriously later. 1500 = getting close; 1900 = right
    // at the edge, this specific message may already be at risk.
    if(url.length >= 1900){
      log('⚠️ Request URL is ' + url.length + ' chars — very close to the safe GET limit (~2000). This message may get cut off. Consider starting a fresh conversation.', 'SYSTEM');
    } else if(url.length >= 1500){
      log('Request URL is ' + url.length + ' chars and growing (safe limit ~2000) — conversation is getting long.', 'SYSTEM');
    }

    const r=await fetch(url, { signal: abortController.signal });"""
          new = """    const r=await fetch(NOVA_API_URL, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,session,context:{page:'NOVA Command Center',app:'Flower Tools'}}),signal:abortController.signal});"""
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-security-cleanup.yml .github/workflows/security-cleanup-v2.yml
          git add -A
          git diff --cached --quiet || git commit -m "security: remove legacy Apps Script runtime from NOVA"
          git push