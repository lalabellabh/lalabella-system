<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lalabella — Flower Calculator V2</title>
<script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script>
<style>
:root{--rose:#b43d5b;--rose2:#8f2945;--bg:#faf5f3;--ink:#30242a;--muted:#806f77;--line:#ead8dc;--card:#fff;--green:#4e7d58}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8f7,#eef6ef);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1080px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top a{color:var(--muted);text-decoration:none}.brand{font-weight:800;color:var(--rose2)}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.8fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 28px #7b334010}.title{font-size:20px;font-weight:800;margin-bottom:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:15px;outline:none}input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #b43d5b18}.picker{position:relative}.results{position:absolute;z-index:50;left:0;right:0;top:100%;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 35px #0002;max-height:310px;overflow:auto;display:none}.results.open{display:block}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #f1e7e9;cursor:pointer}.item:last-child{border:0}.item:hover,.item.active{background:#fff2f4}.name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:3px}.rate{font-weight:800;color:var(--rose2);white-space:nowrap}.status{font-size:12px;color:var(--green);margin-top:7px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff}.outline{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.selected{margin-top:9px;font-size:13px;color:var(--muted)}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f0e4e6}.cartrow strong{display:block}.small{font-size:12px;color:var(--muted)}.del{border:0;background:none;color:#b33b43;font-size:18px;cursor:pointer}.tot{display:flex;justify-content:space-between;padding:7px 0}.grand{border-top:2px solid var(--rose);margin-top:7px;padding-top:12px;font-size:19px;font-weight:900;color:var(--rose2)}.notice{padding:10px 12px;border-radius:10px;background:#f7f2ed;color:#6e5a4f;font-size:12px;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:25px 5px}.loading{color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .btn{grid-column:1/-1;width:100%}}
</style>
</head><body>
<div class="wrap">
<div class="top"><a href="flower-tools.html">← Flower Tools</a><div class="brand">LALABELLA FLOWERS</div></div>
<div class="grid">
<section class="card"><div class="title">🌸 Flower Calculator</div>
<div class="label">Flower</div><div class="picker"><input id="flower" autocomplete="off" placeholder="Tap here to choose or type a flower…" aria-label="Flower"><div id="results" class="results"></div></div>
<div id="catalogState" class="status">Loading flower catalog…</div>
<div class="row" style="margin-top:14px"><div><div class="label">Quantity</div><input id="qty" type="number" min="0" step="0.5" placeholder="0"></div><div><div class="label">Rate (BD)</div><input id="rate" type="number" min="0" step="0.001" placeholder="0.000"></div><button id="add" class="btn primary" disabled>Add</button></div>
<div id="selected" class="selected"></div>
<div class="notice">The catalog is read directly from Supabase <b>flower_item</b>. No Google Sheets / Apps Script is used.</div>
</section>
<section class="card"><div class="title">🧾 Order List</div><div id="cart"><div class="empty">No flowers added yet.</div></div>
<div class="tot"><span>Flowers</span><b id="flowersTotal">0.000 BD</b></div><div class="label">Extra</div><div class="row"><input id="extraName" placeholder="Vase, handwork, box"><input id="extraPrice" type="number" min="0" step="0.001" placeholder="0.000"><button id="extraAdd" class="btn outline">Add</button></div><div id="extras"></div>
<div class="tot"><span>Extras</span><b id="extrasTotal">0.000 BD</b></div><div class="tot grand"><span>Grand Total</span><span id="grand">0.000 BD</span></div>
</section></div></div>
<script>
(async()=>{
 const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
 let catalog=[],selected=null,cart=[],extras=[];
 try{
   await window.LalabellaSupabase.ready();
   const user=await window.LalabellaAuth.getUser(); if(!user){location.replace('index.html');return;}
   const sb=window.LalabellaSupabase.client;
   const {data,error}=await sb.from('flower_item').select('id,flower_name,rate,origin,status').order('flower_name',{ascending:true});
   if(error) throw error;
   catalog=(data||[]).filter(x=>String(x.status||'').trim().toLowerCase()==='active' && String(x.flower_name||'').trim()).map(x=>({id:x.id,name:String(x.flower_name).trim(),rate:Number(x.rate)||0,origin:String(x.origin||'').trim()}));
   $('catalogState').textContent=`${catalog.length} active flowers loaded`;
   $('catalogState').style.color='var(--green)';
 }catch(e){console.error(e);$('catalogState').textContent='Catalog error: '+(e?.message||e);return;}
 const render=q=>{q=String(q||'').trim().toLowerCase();const list=(q?catalog.filter(x=>x.name.toLowerCase().includes(q)):catalog).slice(0,40);$('results').innerHTML=list.length?list.map(x=>`<div class="item" data-id="${x.id}"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.origin||'Flower')}</div></div><div class="rate">${fmt(x.rate)} BD</div></div>`).join(''):'<div class="empty">No matching flower.</div>';if(list.length||q)$('results').classList.add('open');};
 $('flower').addEventListener('focus',()=>render($('flower').value));
 $('flower').addEventListener('input',()=>{selected=null;$('selected').textContent='';$('add').disabled=true;render($('flower').value)});
 $('results').addEventListener('mousedown',e=>{const el=e.target.closest('.item');if(!el)return;const x=catalog.find(v=>String(v.id)===el.dataset.id);if(!x)return;selected=x;$('flower').value=x.name;$('rate').value=x.rate.toFixed(3);$('selected').textContent=`Selected: ${x.name} · ${fmt(x.rate)} BD`;$('add').disabled=false;$('results').classList.remove('open');});
 document.addEventListener('click',e=>{if(!e.target.closest('.picker'))$('results').classList.remove('open')});
 const draw=()=>{let ft=cart.reduce((s,x)=>s+x.qty*x.rate,0),et=extras.reduce((s,x)=>s+x.price,0);$('cart').innerHTML=cart.length?cart.map((x,i)=>`<div class="cartrow"><div><strong>${esc(x.name)}</strong><span class="small">${x.qty} × ${fmt(x.rate)} BD = ${fmt(x.qty*x.rate)} BD</span></div><button class="del" data-del="${i}">×</button></div>`).join(''):'<div class="empty">No flowers added yet.</div>';$('extras').innerHTML=extras.map((x,i)=>`<div class="cartrow"><div><strong>${esc(x.name)}</strong><span class="small">${fmt(x.price)} BD</span></div><button class="del" data-extra="${i}">×</button></div>`).join('');$('flowersTotal').textContent=fmt(ft)+' BD';$('extrasTotal').textContent=fmt(et)+' BD';$('grand').textContent=fmt(ft+et)+' BD';};
 $('add').onclick=()=>{const qty=Number($('qty').value),rate=Number($('rate').value);if(!selected||qty<=0||rate<0)return;cart.push({name:selected.name,qty,rate});$('qty').value='';draw();};
 $('extraAdd').onclick=()=>{const name=$('extraName').value.trim(),price=Number($('extraPrice').value);if(!name||price<0)return;extras.push({name,price});$('extraName').value='';$('extraPrice').value='';draw();};
 $('cart').onclick=e=>{const b=e.target.closest('[data-del]');if(b){cart.splice(Number(b.dataset.del),1);draw()}};$('extras').onclick=e=>{const b=e.target.closest('[data-extra]');if(b){extras.splice(Number(b.dataset.extra),1);draw()}};
 $('flower').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();$('results').querySelector('.item')?.focus?.()}if(e.key==='Escape')$('results').classList.remove('open');});
 draw();
})();
</script></body></html>
